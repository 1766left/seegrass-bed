<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海草守护者：沉船宝藏的秘密</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft Yahei",sans-serif;
    background:linear-gradient(180deg,#d9f3fb 0%,#bfe9f7 60%,#a8dff2 100%);
    color:#12405c;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:14px 16px 20px;
  }
  header { text-align:center; margin-bottom:10px; }
  header h1 {
    font-size:30px; letter-spacing:2px; color:#0b5e86;
    text-shadow:0 2px 0 #fff;
  }
  header p { font-size:15px; color:#2a7ba3; margin-top:4px; }

  /* ===== 主舞台 ===== */
  #stage {
    display:flex; gap:16px; width:100%; max-width:1120px;
    align-items:stretch;
  }
  .panel {
    flex:1; position:relative; border-radius:18px; overflow:hidden;
    box-shadow:0 6px 18px rgba(11,74,110,.18); background:#0d5c8f;
    border:4px solid #fff;
  }
  .panel svg { display:block; width:100%; height:auto; }
  .panel-tag {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    padding:5px 16px; border-radius:999px; font-size:15px; font-weight:700;
    color:#fff; z-index:5; white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .panel.left  .panel-tag { background:#1d9e5f; }
  .panel.right .panel-tag { background:#6d7a84; }
  .flow-chip {
    position:absolute; top:12px; font-size:13px; font-weight:700; z-index:5;
    padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.85);
    color:#135a80; transition:box-shadow .3s, background .3s;
  }
  .panel.left  .flow-chip { right:10px; }
  .panel.right .flow-chip { left:10px; }
  .flow-chip.hot { background:#fff59d; box-shadow:0 0 0 3px #ffd54f, 0 0 14px #ffd54f; }
  .flow-chip.bad { background:#ffd6d6; box-shadow:0 0 0 3px #ff8a80; }

  /* ===== SVG 内部动画 ===== */
  .blade {
    animation:sway var(--dur,3s) ease-in-out infinite alternate;
    animation-delay:var(--del,0s);
  }
  @keyframes sway {
    from { transform:rotate(-4.5deg); }
    to   { transform:rotate(4.5deg); }
  }
  .arrow { animation:flowL var(--fd,6s) linear infinite; }
  @keyframes flowL {
    from { transform:translateX(0); opacity:1; }
    85%  { opacity:.9; }
    to   { transform:translateX(-580px); opacity:.15; }
  }
  .swimR { animation:swimR var(--sd,15s) linear infinite; }
  @keyframes swimR {
    from { transform:translateX(-70px); }
    to   { transform:translateX(560px); }
  }
  .swimL { animation:swimL var(--sd,15s) linear infinite; }
  @keyframes swimL {
    from { transform:translateX(560px) scaleX(-1); }
    to   { transform:translateX(-70px) scaleX(-1); }
  }
  .walk { animation:walk 9s ease-in-out infinite alternate; }
  @keyframes walk {
    from { transform:translateX(0); }
    to   { transform:translateX(110px); }
  }
  .pulse-dot { animation:pdot 1.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes pdot {
    0%,100% { transform:scale(1); opacity:.95; }
    50%     { transform:scale(1.55); opacity:.55; }
  }
  .sparkle { animation:spark 1.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes spark {
    0%,100% { transform:scale(1) rotate(0deg); opacity:.9; }
    50%     { transform:scale(1.3) rotate(18deg); opacity:.6; }
  }
  .glow { filter:drop-shadow(0 0 6px #fff176) drop-shadow(0 0 14px #ffe082); }
  .glow-blue { filter:drop-shadow(0 0 6px #90caf9) drop-shadow(0 0 14px #64b5f6); }
  [data-hot] { cursor:pointer; }
  /* 非交互层不拦截点击 */
  .sedG, .oxy, .bubbleG, .dlab, .flowG, .hint-dot, .grassG .blade, .rootsG g { pointer-events:none; }
  .rot.pulsing { animation:rotpulse 1s ease-in-out infinite; }
  @keyframes rotpulse {
    0%,100% { opacity:.85; } 50% { opacity:.45; }
  }

  /* 提示点 */
  .hint-dot { fill:#fff59d; stroke:#f9a825; stroke-width:2; }

  /* 气泡 */
  .bubble { fill:rgba(255,255,255,.85); }

  /* 演示标签 */
  .demo-label {
    font-size:16px; font-weight:800; paint-order:stroke; stroke:#fff;
    stroke-width:4px; fill:#0b5e86;
  }

  /* 对话泡泡 */
  .speech {
    position:absolute; z-index:8; left:52%; top:38%;
    background:#fff; border:3px solid #1d9e5f; border-radius:14px;
    padding:8px 12px; font-size:14px; font-weight:600; color:#0b5e86;
    max-width:230px; opacity:0; transform:scale(.6); transition:all .3s;
    pointer-events:none;
  }
  .speech::after {
    content:""; position:absolute; bottom:-12px; left:26px;
    border:7px solid transparent; border-top-color:#1d9e5f;
  }
  .speech.show { opacity:1; transform:scale(1); }

  /* ===== 控制区 ===== */
  #controls {
    width:100%; max-width:1120px; margin-top:14px;
    background:#fff; border-radius:16px; padding:12px 22px 16px;
    box-shadow:0 4px 14px rgba(11,74,110,.12);
  }
  #ctrl-row { display:flex; align-items:center; gap:14px; }
  #playBtn {
    width:44px; height:44px; border-radius:50%; border:none; flex:none;
    background:#1d9e5f; color:#fff; font-size:19px; cursor:pointer;
    box-shadow:0 3px 8px rgba(29,158,95,.4); transition:transform .15s;
  }
  #playBtn:active { transform:scale(.92); }
  #slider-wrap { flex:1; position:relative; padding-top:6px; }
  #timeSlider { -webkit-appearance:none; appearance:none; width:100%; height:10px;
    border-radius:6px; outline:none;
    background:linear-gradient(90deg,#8fdcf5,#1d9e5f); cursor:pointer; }
  #timeSlider::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none; width:28px; height:28px;
    border-radius:50%; background:#fff; border:5px solid #0b5e86;
    box-shadow:0 2px 6px rgba(0,0,0,.3); cursor:grab;
  }
  #ticks { position:relative; height:20px; margin-top:6px; font-size:12px; color:#4a7f9d; font-weight:600; }
  #ticks span { position:absolute; transform:translateX(-50%); }
  #yearBadge {
    flex:none; min-width:96px; text-align:center; font-size:17px; font-weight:800;
    color:#fff; background:#0b5e86; border-radius:12px; padding:8px 6px;
  }
  #ctrl-hint { text-align:center; margin-top:6px; font-size:14px; color:#2a7ba3; font-weight:600; }
  #ctrl-hint b { color:#1d9e5f; }

  /* ===== 信息卡 ===== */
  #infoCard {
    position:fixed; z-index:50; left:50%; bottom:118px; transform:translateX(-50%) translateY(20px);
    width:min(560px, 92vw); background:#fffdf3; border:3px solid #ffd54f;
    border-radius:16px; padding:14px 46px 14px 16px; display:flex; gap:12px;
    align-items:flex-start; box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:all .3s;
  }
  #infoCard.show { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #ic-icon { font-size:34px; line-height:1; flex:none; }
  #ic-title { font-size:17px; font-weight:800; color:#0b5e86; margin-bottom:3px; }
  #ic-text { font-size:15px; line-height:1.55; color:#33566b; }
  #ic-close {
    position:absolute; top:8px; right:10px; border:none; background:none;
    font-size:22px; color:#b08a2e; cursor:pointer; font-weight:700;
  }

  /* ===== 彩蛋弹窗 ===== */
  #modal {
    position:fixed; inset:0; z-index:60; background:rgba(6,44,66,.6);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #modal.show { opacity:1; pointer-events:auto; }
  .m-card {
    background:#fffdf3; border-radius:20px; border:4px solid #1d9e5f;
    width:min(480px,94vw); padding:20px 22px; position:relative; text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.35); transform:scale(.85); transition:transform .25s;
  }
  #modal.show .m-card { transform:scale(1); }
  .m-close {
    position:absolute; top:10px; right:12px; width:34px; height:34px; border-radius:50%;
    border:none; background:#e0e0e0; color:#555; font-size:17px; font-weight:700; cursor:pointer;
  }
  .m-close:hover { background:#ffab91; }
  #m-ill { margin:2px auto 10px; }
  #m-title { font-size:20px; font-weight:800; color:#0b5e86; margin-bottom:8px; }
  #m-text { font-size:15px; line-height:1.7; color:#33566b; text-align:left; }
  #m-text b { color:#1d9e5f; }

  @media (max-width:820px) {
    #stage { flex-direction:column; }
    header h1 { font-size:22px; }
  }
</style>
</head>
<body>

<header>
  <h1>🌿 海草守护者：沉船宝藏的秘密 🚢</h1>
  <p>扮演海底观察员，看看海草如何在 100 年里守护一艘沉船的宝藏！</p>
</header>

<div id="stage">
  <div class="panel left" id="panelL">
    <div class="panel-tag">🌿 有海草保护</div>
    <div class="flow-chip" id="chipL">水流 慢 🐢</div>
    <div class="speech" id="speech"></div>
  </div>
  <div class="panel right" id="panelR">
    <div class="panel-tag">🏝 没有海草保护</div>
    <div class="flow-chip" id="chipR">水流 快 💨</div>
  </div>
</div>

<div id="controls">
  <div id="ctrl-row">
    <button id="playBtn" title="自动播放 100 年">▶</button>
    <div id="slider-wrap">
      <input type="range" id="timeSlider" min="0" max="100" step="1" value="0">
      <div id="ticks">
        <span style="left:0%">0年</span><span style="left:10%">10年</span>
        <span style="left:30%">30年</span><span style="left:50%">50年</span>
        <span style="left:100%">100年</span>
      </div>
    </div>
    <div id="yearBadge">第 0 年</div>
  </div>
  <div id="ctrl-hint">👉 拖动时间滑块，再点击场景中的<b>黄色提示点</b>，探索海草保护沉船宝藏的三大本领！</div>
</div>

<!-- 信息卡 -->
<div id="infoCard">
  <div id="ic-icon">💡</div>
  <div><div id="ic-title"></div><div id="ic-text"></div></div>
  <button id="ic-close">✕</button>
</div>

<!-- 彩蛋弹窗 -->
<div id="modal">
  <div class="m-card">
    <button class="m-close" id="m-close">✕</button>
    <div id="m-ill"></div>
    <div id="m-title"></div>
    <div id="m-text"></div>
  </div>
</div>

<script>
"use strict";
/* =========================================================
   海草守护者：沉船宝藏的秘密
   左右分屏对比 · 时间滑块 0-100 年 · 三大保护机制交互
   ========================================================= */

var SVGNS = "http://www.w3.org/2000/svg";
var $ = function(s){ return document.querySelector(s); };

/* ---------- 工具函数 ---------- */
function plerp(y, pts){                 // 分段线性插值
  if (y <= pts[0][0]) return pts[0][1];
  for (var i = 1; i < pts.length; i++) {
    if (y <= pts[i][0]) {
      var y0 = pts[i-1][0], v0 = pts[i-1][1], y1 = pts[i][0], v1 = pts[i][1];
      return v0 + (v1 - v0) * (y - y0) / (y1 - y0);
    }
  }
  return pts[pts.length-1][1];
}
function mix(a, b, t){                  // 颜色混合 #rrggbb
  var pa = [1,3,5].map(function(i){ return parseInt(a.substr(i,2),16); });
  var pb = [1,3,5].map(function(i){ return parseInt(b.substr(i,2),16); });
  return "#" + pa.map(function(v,i){
    return Math.round(v + (pb[i]-v)*t).toString(16).padStart(2,"0");
  }).join("");
}
var _seed = 7;
function rnd(){ _seed = (_seed * 9301 + 49297) % 233280; return _seed / 233280; }

/* ---------- 场景绘制（左/右共用模板） ---------- */
function buildScene(panelId, hasGrass){
  var panel = document.getElementById(panelId);
  var svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 480 420");
  panel.appendChild(svg);

  var gid = panelId + "-water";
  var html = '' +
  '<defs>' +
    '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#8fdcf5"/><stop offset=".5" stop-color="#3ba7d9"/>' +
      '<stop offset="1" stop-color="#0d5c8f"/>' +
    '</linearGradient>' +
  '</defs>' +
  '<rect x="0" y="0" width="480" height="420" fill="url(#' + gid + ')"/>' +
  /* 光柱 */
  '<polygon points="60,0 120,0 40,330 -20,330" fill="rgba(255,255,255,.07)"/>' +
  '<polygon points="300,0 350,0 260,330 200,330" fill="rgba(255,255,255,.06)"/>' +
  /* 背景小鱼（装饰） */
  '<g opacity=".45"><path class="swimR" style="--sd:26s" d="M0,60 l14,-6 v12 z M6,60 a8,5 0 1 0 16,0 a8,5 0 1 0 -16,0" fill="#b3e5fc" transform="translate(0,0)"/></g>' +
  /* 海底与地下剖面 */
  '<rect x="0" y="330" width="480" height="90" fill="#7a5c39"/>' +
  '<rect x="0" y="330" width="480" height="8" fill="#95774e"/>' +
  '<circle cx="60" cy="370" r="5" fill="#6b4f30"/><circle cx="180" cy="395" r="6" fill="#6b4f30"/>' +
  '<circle cx="300" cy="365" r="4" fill="#6b4f30"/><circle cx="420" cy="390" r="5" fill="#6b4f30"/>' +
  '<circle cx="120" cy="385" r="3" fill="#8a6a42"/><circle cx="360" cy="378" r="3" fill="#8a6a42"/>' +
  /* 根系层 */
  '<g class="rootsG"></g>' +
  /* 沉船 */
  '<g class="wreck" data-hot="1">' +
    '<g transform="rotate(-4 240 300)">' +
      '<path class="hull" d="M132,332 Q136,252 158,244 L322,244 Q344,252 348,332 Z" fill="#8a5a33" stroke="#5f3c1e" stroke-width="3"/>' +
      '<path class="deckbreak" d="M150,244 L175,233 L200,244 L225,229 L250,242 L275,232 L300,244 L322,244" fill="none" stroke="#5f3c1e" stroke-width="3" stroke-linejoin="round"/>' +
      '<line x1="146" y1="266" x2="338" y2="266" stroke="rgba(0,0,0,.18)" stroke-width="2"/>' +
      '<line x1="140" y1="288" x2="344" y2="288" stroke="rgba(0,0,0,.18)" stroke-width="2"/>' +
      '<line x1="136" y1="310" x2="346" y2="310" stroke="rgba(0,0,0,.18)" stroke-width="2"/>' +
      '<circle cx="168" cy="298" r="7" fill="#2b3a4a" stroke="#5f3c1e" stroke-width="2"/>' +
      '<rect class="mast" x="316" y="204" width="9" height="46" rx="3" fill="#6e4526" transform="rotate(12 320 226)"/>' +
      /* 文物 */
      '<g class="art-shoe" data-hot="1">' +
        '<path d="M0,0 C-1,-11 4,-15 12,-15 C21,-15 25,-8 27,-2 L27,0 Z" fill="#7a4a21" stroke="#4e2d10" stroke-width="1.5" transform="translate(172,316)"/>' +
        '<path d="M172,316 L199,316" stroke="#4e2d10" stroke-width="2.5"/>' +
      '</g>' +
      '<g class="art-umb" data-hot="1">' +
        '<path d="M-26,0 Q0,-34 26,0 Q13,7 0,1 Q-13,7 -26,0 Z" fill="#f6ead0" stroke="#b98d5f" stroke-width="1.5" transform="translate(240,300)"/>' +
        '<line x1="240" y1="302" x2="240" y2="330" stroke="#b98d5f" stroke-width="2.5"/>' +
        '<path d="M240,330 q0,7 8,6" fill="none" stroke="#b98d5f" stroke-width="2.5"/>' +
      '</g>' +
      '<g class="art-wood" data-hot="1">' +
        '<rect x="278" y="304" width="38" height="24" rx="3" fill="#9c6b3c" stroke="#6b4423" stroke-width="2"/>' +
        '<path d="M278,304 Q297,292 316,304" fill="#a87a4a" stroke="#6b4423" stroke-width="2"/>' +
        '<line x1="286" y1="312" x2="308" y2="312" stroke="#6b4423" stroke-width="1.5"/>' +
        '<line x1="286" y1="320" x2="308" y2="320" stroke="#6b4423" stroke-width="1.5"/>' +
      '</g>' +
      /* 腐烂斑块（右侧用） */
      '<g class="rots">' +
        '<ellipse class="rot" cx="205" cy="300" rx="26" ry="11" fill="#241a10"/>' +
        '<ellipse class="rot" cx="298" cy="268" rx="20" ry="12" fill="#241a10"/>' +
        '<ellipse class="rot" cx="250" cy="322" rx="30" ry="9" fill="#241a10"/>' +
      '</g>' +
    '</g>' +
  '</g>' +
  /* 泥沙沉积层 */
  '<g class="sedG"><rect class="sed" x="0" y="326" width="480" height="4" fill="rgba(198,166,112,.8)"/>' +
  '<rect class="sedtop" x="0" y="326" width="480" height="3" fill="rgba(255,236,190,.9)"/></g>' +
  /* 缺氧遮罩 */
  '<rect class="oxy" x="60" y="240" width="380" height="95" fill="rgba(18,44,96,.4)" style="opacity:0;transition:opacity .6s"/>' +
  /* 气泡组 */
  '<g class="bubbleG" style="display:none"></g>' +
  /* 演示标签 */
  '<text class="demo-label dlab" x="240" y="150" text-anchor="middle" style="display:none"></text>' +
  /* 热区（在沉船/彩蛋图标之下，避开沉船主体） */
  '<g class="hotgrass">' +
    '<rect class="hot-roots" data-hot="1" x="10" y="333" width="460" height="55" fill="transparent"/>' +
    '<rect class="hot-grass" data-hot="1" x="10" y="168" width="125" height="162" fill="transparent"/>' +
    '<rect class="hot-grass" data-hot="1" x="345" y="168" width="125" height="162" fill="transparent"/>' +
    '<rect class="hot-grass" data-hot="1" x="130" y="168" width="220" height="60" fill="transparent"/>' +
  '</g>';

  if (hasGrass) {
    html += '<g class="grassG"></g>';
  }
  /* 水流箭头 */
  html += '<g class="flowG">';
  [70,130,190,255].forEach(function(ay, i){
    html += '<g class="arrow" style="--del:' + (i*-1.6).toFixed(1) + 's">' +
      '<g transform="translate(520,' + ay + ')">' +
        '<line x1="0" y1="0" x2="44" y2="0" stroke="rgba(255,255,255,.75)" stroke-width="3.5" stroke-linecap="round"/>' +
        '<polygon points="44,-6 58,0 44,6" fill="rgba(255,255,255,.75)"/>' +
      '</g></g>';
  });
  html += '</g>';

  if (hasGrass) {
    /* 互动小鱼和螃蟹 */
    html += '<g class="fish1" data-hot="1"><g class="swimR" style="--sd:16s" transform="translate(0,215)">' +
      '<ellipse cx="0" cy="0" rx="15" ry="9" fill="#ff8c42"/><polygon points="-13,0 -25,-8 -25,8" fill="#ff8c42"/>' +
      '<circle cx="7" cy="-2" r="2" fill="#333"/></g></g>' +
      '<g class="fish2" data-hot="1"><g class="swimL" style="--sd:22s" transform="translate(0,175)">' +
      '<ellipse cx="0" cy="0" rx="12" ry="7" fill="#ffd54f"/><polygon points="11,0 21,-7 21,7" fill="#ffd54f"/>' +
      '<circle cx="-6" cy="-2" r="1.8" fill="#333"/></g></g>' +
      '<g class="crab" data-hot="1"><g class="crabpos"><g class="walk" transform="translate(70,322)">' +
      '<ellipse cx="0" cy="0" rx="10" ry="6.5" fill="#e05252"/>' +
      '<line x1="-8" y1="4" x2="-14" y2="9" stroke="#b23c3c" stroke-width="2"/>' +
      '<line x1="-3" y1="5" x2="-6" y2="11" stroke="#b23c3c" stroke-width="2"/>' +
      '<line x1="3" y1="5" x2="6" y2="11" stroke="#b23c3c" stroke-width="2"/>' +
      '<line x1="8" y1="4" x2="14" y2="9" stroke="#b23c3c" stroke-width="2"/>' +
      '<line x1="-4" y1="-6" x2="-6" y2="-11" stroke="#b23c3c" stroke-width="1.8"/>' +
      '<line x1="4" y1="-6" x2="6" y2="-11" stroke="#b23c3c" stroke-width="1.8"/>' +
      '<circle cx="-6" cy="-12" r="1.8" fill="#333"/><circle cx="6" cy="-12" r="1.8" fill="#333"/>' +
      '</g></g></g>' +
      /* 彩蛋：史前遗迹（贝壳图标） */
      '<g class="eg-shell" data-hot="1" transform="translate(30,150)">' +
        '<path d="M-14,4 Q0,-16 14,4 Q7,9 0,9 Q-7,9 -14,4 Z" fill="#f2b6c4" stroke="#d9788e" stroke-width="1.5"/>' +

/* ---------- 生成海草与根系 ---------- */
var BLADE_SPECS = [];
(function(){
  for (var i = 0; i < 36; i++) {
    BLADE_SPECS.push({
      x: 20 + i * 12.6 + rnd() * 7,
      maxH: 60 + rnd() * 52,
      c1: (rnd() * 14 - 7),
      c2: (rnd() * 22 - 11),
      dur: (2.2 + rnd() * 1.8).toFixed(2) + "s",
      del: (-rnd() * 3).toFixed(2) + "s",
      col: ["#2fa864", "#37b56d", "#2a9159", "#43c17a"][i % 4]
    });
  }
})();

function initPlants(S){
  if (!S.hasGrass) return;
  BLADE_SPECS.forEach(function(b){
    var p = document.createElementNS(SVGNS, "path");
    p.setAttribute("class", "blade");
    p.setAttribute("fill", b.col);
    p.setAttribute("stroke", b.col);          /* 描边加宽叶片，避免细线感 */
    p.setAttribute("stroke-width", "4.2");
    p.setAttribute("stroke-linecap", "round");
    p.style.setProperty("--dur", b.dur);
    p.style.setProperty("--del", b.del);
    p.style.display = "none";
    S.grassG.appendChild(p);
    S.blades.push({ el: p, spec: b });
  });
  BLADE_SPECS.forEach(function(b, i){
    if (i % 2) return;                       // 一半植物配根系，避免太密
    var g = document.createElementNS(SVGNS, "g");
    g.setAttribute("stroke", "#e8d49a");
    g.setAttribute("stroke-width", "2.2");
    g.setAttribute("fill", "none");
    g.setAttribute("stroke-linecap", "round");
    var x = b.x;
    g.innerHTML =
      '<path d="M' + x + ',332 C' + (x-5) + ',350 ' + (x+7) + ',364 ' + (x-2) + ',380"/>' +
      '<path d="M' + x + ',344 L' + (x-11) + ',356"/>' +
      '<path d="M' + x + ',356 L' + (x+12) + ',368"/>' +
      '<circle cx="' + (x+5) + '" cy="372" r="2.4" fill="#e8d49a" stroke="none"/>' +
      '<circle cx="' + (x-7) + '" cy="362" r="2" fill="#e8d49a" stroke="none"/>';
    g.dataset.x = x;
    g.style.display = "none";
    S.rootsG.appendChild(g);
    S.roots.push(g);
  });
}

/* ---------- 场景状态更新 ---------- */
function layoutGrass(S, y, sedH){
  if (!S.hasGrass) return;
  var count = Math.round(plerp(y, [[0,8],[10,14],[30,24],[50,32],[100,36]]));
  var hFac  = plerp(y, [[0,0.28],[10,0.45],[30,0.75],[50,1],[100,1.08]]);
  var by = 330 - sedH;
  var hSum = 0, hN = 0;
  S.blades.forEach(function(b, i){
    var vis = i < count;
    b.el.style.display = vis ? "" : "none";
    if (!vis) return;
    var h = b.spec.maxH * hFac;
    var bx = b.spec.x;
    b.el.setAttribute("d",
      "M" + bx + "," + by +
      " Q" + (bx + b.spec.c1) + "," + (by - h*0.55) +
      " " + (bx + b.spec.c2) + "," + (by - h));
    b.el.style.transformOrigin = bx + "px " + by + "px";
    hSum += h; hN++;
  });
  S.canopyY = by - (hN ? hSum/hN : 0) * 0.75;

  var rf = plerp(y, [[0,0],[8,0.45],[20,0.85],[35,1]]);
  S.roots.forEach(function(g){
    var vis = rf > 0.02;
    g.style.display = vis ? "" : "none";
    if (vis) {
      g.style.transform = "scale(1," + rf.toFixed(3) + ")";
      g.style.transformOrigin = g.dataset.x + "px 332px";
    }
  });
}

function setSed(S, h){
  S.sed.setAttribute("y", 330 - h);
  S.sed.setAttribute("height", Math.max(h, 0.5));
  S.sedtop.setAttribute("y", 330 - h);
  if (S.crab) S.crab.style.transform = "translateY(" + (-h) + "px)";
}

function applyRightDecay(S, y){
  var d = plerp(y, [[0,0],[10,.15],[30,.4],[50,.65],[80,.85],[100,1]]);
  S.hull.setAttribute("fill", mix("#8a5a33", "#6e6257", d * 0.9));
  S.rots.forEach(function(r, i){
    r.style.opacity = Math.max(0, d * 0.85 - i * 0.08);
  });
  S.umbG.style.opacity = plerp(y, [[0,1],[40,1],[60,.7],[80,.25],[90,0]]);
  S.woodG.style.opacity = plerp(y, [[0,1],[50,1],[100,.3]]);
  S.mast.style.opacity  = plerp(y, [[0,1],[50,1],[80,.35],[100,0]]);
  S.shoe.setAttribute("fill", mix("#7a4a21", "#8d8a80", d));
}

function updateFlow(S, y){
  var dur = S.hasGrass ? plerp(y, [[0,7],[30,10],[100,13]]) : 3;
  S.arrows.forEach(function(a){
    a.style.setProperty("--fd", dur + "s");
  });
}

/* ---------- 提示点与图标 ---------- */
function updateHints(y){
  [L, R].forEach(function(S){
    var H = S.hints;
    function show(k, on){ H[k].style.display = on ? "" : "none"; }
    if (S.hasGrass) {
      var gy = (330 - plerp(y,[[0,4],[10,10],[30,26],[50,42],[100,58]])) - 60;
      H.grass.setAttribute("cy", Math.max(gy, 190));
      show("grass", y < 100);
      show("roots", y >= 10 && y < 30);
      show("shoe", y >= 100); show("umb", y >= 100); show("wood", y >= 100);
      show("chess", y >= 95);
      S.egChess.style.display = y >= 95 ? "" : "none";
    } else {
      show("grass", false); show("roots", false);
      show("shoe", false); show("umb", false); show("wood", false);
      show("shovel", y >= 80);
      S.egShovel.style.display = y >= 80 ? "" : "none";
    }
  });
}

/* 根系演示：固定泥沙 */
function demoRoots(){
  clearDemos();
  L.rootsG.classList.add("glow");
  demoLabel(L, "泥沙被根系抓住了！", 168);
  demoLabel(R, "没有根系，泥沙被冲走…", 168);
  /* 左侧：被缠住的泥沙颗粒 */
  for (var i = 0; i < 6; i++) {
    var c = document.createElementNS(SVGNS, "circle");
    c.setAttribute("cx", 60 + i * 62 + Math.random() * 20);
    c.setAttribute("cy", 350 + Math.random() * 22);
    c.setAttribute("r", 3.5);
    c.setAttribute("fill", "#d9b980");
    L.bubbleG.appendChild(c);
  }
  L.bubbleG.style.display = "";
  /* 右侧：泥沙被冲走动画 */
  R.bubbleG.style.display = "";
  var t0 = performance.now(), DUR = 3000;
  var parts = [];
  for (var j = 0; j < 8; j++) {
    var p = document.createElementNS(SVGNS, "circle");
    p.setAttribute("r", 3 + Math.random() * 2);
    p.setAttribute("fill", "#d9b980");
    p.dataset.sx = 100 + j * 40;
    p.dataset.sy = 340 + Math.random() * 20;
    p.dataset.vx = -(40 + Math.random() * 50);
    p.dataset.vy = -(8 + Math.random() * 25);
    R.bubbleG.appendChild(p);
    parts.push(p);
  }
  function step(now){
    var t = (now - t0) / 1000;
    if (t > DUR / 1000) { R.bubbleG.style.display = "none"; return; }
    parts.forEach(function(p){
      p.setAttribute("cx", parseFloat(p.dataset.sx) + parseFloat(p.dataset.vx) * t);
      p.setAttribute("cy", parseFloat(p.dataset.sy) + parseFloat(p.dataset.vy) * t);
      p.setAttribute("opacity", Math.max(0, 1 - t / 2.6));
    });
    bubbleRAF = requestAnimationFrame(step);
  }
  bubbleRAF = requestAnimationFrame(step);
  demoTimers.push(setTimeout(clearDemos, 5000));
}
/* 海草床演示：缺氧保护 */
function demoOxy(){
  clearDemos();
  L.grassG.classList.add("glow");
  L.sed.classList.add("glow");
  L.oxy.setAttribute("y", (L.canopyY || 250));
  L.oxy.setAttribute("height", Math.max(340 - (L.canopyY || 250), 40));
  L.oxy.style.opacity = 1;
  demoLabel(L, "缺氧区：细菌无法生存 🛡", 138);
  demoLabel(R, "氧气畅通：文物持续腐烂 ⚠", 138);
  R.rots.forEach(function(r){ r.classList.add("pulsing"); });
  /* 左：气泡被挡在海草床上方；右：氧气沉入船体 */
  L.bubbleG.style.display = "";
  spawnBubbles(L, 6);
  R.bubbleG.style.display = "";
  spawnBubbles(R, 5);
  var canopy = L.canopyY || 250;
  var lb = Array.prototype.slice.call(L.bubbleG.children).slice(0, 6);
  var rb = Array.prototype.slice.call(R.bubbleG.children).slice(0, 5);
  var t0 = performance.now(), DUR = 5000;
  function step(now){
    var t = (now - t0) / 1000;
    if (t > DUR / 1000) return;
    lb.forEach(function(b, i){
      var cyc = (t * 0.9 + i * 0.17) % 1;
      var y = canopy + 60 - cyc * 60;
      if (y < canopy + 6) y = canopy + 6 + Math.sin(t * 6 + i) * 3; /* 被挡住回弹 */
      b.setAttribute("cx", parseFloat(b.dataset.x));
      b.setAttribute("cy", y);
      b.setAttribute("opacity", cyc < 0.08 ? cyc / 0.08 : 1);
    });
    rb.forEach(function(b, i){
      var cyc = (t * 0.8 + i * 0.2) % 1;
      b.setAttribute("cx", parseFloat(b.dataset.x));
      b.setAttribute("cy", 150 + cyc * 160);      /* 一路沉入船体 */
      b.setAttribute("opacity", cyc > 0.75 ? (1 - cyc) / 0.25 : 1);
    });
    bubbleRAF = requestAnimationFrame(step);
  }
  bubbleRAF = requestAnimationFrame(step);
  demoTimers.push(setTimeout(clearDemos, 5600));
}

    if (t.closest(".eg-chess")) { openEgg("chess"); return; }
    if (t.closest(".eg-shovel")) { openEgg("shovel"); return; }
    if (t.closest(".eg-shell"))  { openEgg("shell"); return; }

    /* 互动动物 */
    if (t.closest(".fish1") || t.closest(".fish2") || t.closest(".crab")) {
      var sp = $("#speech");
      sp.textContent = "海草床不仅保护文物，还是我和小伙伴们的家园呢！🐟🦀";
      sp.classList.add("show");
      clearTimeout(sp._t);
      sp._t = setTimeout(function(){ sp.classList.remove("show"); }, 4200);
      return;
    }

    /* 文物 */
    if (t.closest(".art-shoe")) {
      if (y >= 100) showInfo("👞", "100年的皮鞋", "多亏了海草，这只皮鞋在海底躺了100年还保存完好！");
      else showInfo("👞", "一只皮鞋", "它还露在外面呢。拖动时间看看：有海草和没海草，它的命运有什么不同？");
      return;
    }
    if (t.closest(".art-umb")) {
      if (y >= 100) showInfo("☂️", "蕾丝伞的奇迹", "如此脆弱的蕾丝，竟然在海底存活了一个世纪！");
      else showInfo("☂️", "一把蕾丝伞", "蕾丝非常脆弱，最容易被海水破坏。看看100年后它会怎样？");
      return;
    }
    if (t.closest(".art-wood")) {
      if (y >= 100) showInfo("🧰", "木制品", "在陆地上，木头早就腐烂了，但海草创造的环境让它完好如初！");
      else showInfo("🧰", "木制箱子", "木头最怕细菌分解。要怎样阻止细菌破坏它呢？");
      return;
    }
    if (!S.hasGrass && t.closest(".wreck")) {
      showInfo("⚠️", "正在腐烂的沉船", "没有海草保护，泥沙被水流冲走，氧气直达船体，文物正在慢慢腐烂、消失……");
      return;
    }

    /* 左侧三大机制 */
    if (S.hasGrass) {
      if (t.classList.contains("hot-roots")) {
        showInfo("🌱", "本领二：根系固定泥沙", "根系像网一样，牢牢抓住泥沙。泥沙不被冲走，才能慢慢把沉船盖住、保护起来。");
        demoRoots(); return;
      }
      if (t.classList.contains("hot-grass")) {
        if (y < 30) {
          showInfo("🍃", "本领一：长叶片减缓水流", "长长的叶片像屏障，减缓水流速度。水流变慢，泥沙容易沉积，也不会把文物冲坏。");
          demoLeaves();
        } else {
          showInfo("🛡️", "本领三：缺氧环境阻止腐烂", "厚厚的海草和泥沙隔绝氧气，细菌无法生存，文物就不会腐烂！");
          demoOxy();
        }
        return;
      }
    } else {
      if (t.classList.contains("hot-roots")) {
        showInfo("❌", "没有根系固定", "这里没有海草！泥沙失去根系的抓握，被水流一点点冲走……");
        demoRoots(); return;
      }
      if (t.classList.contains("hot-grass")) {
        showInfo("❌", "没有海草床", "这里光秃秃的，没有海草叶片减缓水流，氧气也能自由进入，文物腐烂得很快。去左边点一点海草，对比一下吧！");
        demoLeaves(); return;
      }
    }
  });
}
bindScene(L); bindScene(R);

/* ---------- 主更新 ---------- */
function updateAll(y){
  clearDemos();
  $("#yearBadge").textContent = "第 " + y + " 年";
  var sedL = plerp(y, [[0,4],[10,10],[30,26],[50,42],[100,58]]);
  var sedR = plerp(y, [[0,4],[10,2],[25,0]]);
  setSed(L, sedL); setSed(R, sedR);
  layoutGrass(L, y, sedL);
  layoutGrass(R, y, sedR);
  applyRightDecay(R, y);
  updateFlow(L, y); updateFlow(R, y);
  updateHints(y);
}
var slider = $("#timeSlider");
slider.addEventListener("input", function(){
  stopPlay();
  updateAll(+slider.value);
});

/* ---------- 自动播放 ---------- */
var playing = false, playRAF = null;
function stopPlay(){
  playing = false;
  if (playRAF) cancelAnimationFrame(playRAF);
  $("#playBtn").textContent = "▶";
}
$("#playBtn").addEventListener("click", function(){
  if (playing) { stopPlay(); return; }
  playing = true;
  this.textContent = "⏸";
  var from = +slider.value >= 100 ? 0 : +slider.value;
  var t0 = performance.now(), DUR = 15000;
  function step(now){
    if (!playing) return;
    var t = Math.min((now - t0) / DUR, 1);
    var v = Math.round(from + (100 - from) * t);
    slider.value = v;
    updateAll(v);
    if (t < 1) playRAF = requestAnimationFrame(step);
    else stopPlay();
  }
  playRAF = requestAnimationFrame(step);
});

/* ---------- 启动 ---------- */
updateAll(0);
setTimeout(function(){
  showInfo("👋", "欢迎来到海底！",
    "左边有海草保护，右边没有。拖动下方时间滑块穿越100年，再点击黄色提示点，看看海草的三大本领！");
}, 600);
</script>
